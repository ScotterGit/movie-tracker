<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="controls">
    <select id="genre-select"></select>
    <select id="year-select"></select>
    <select id="bear-rating-select"></select>
    <select id="hubby-rating-select"></select>
    <input type="text" id="director-filter" placeholder="Director" />
    <input type="text" id="writer-filter" placeholder="Writer" />
    <input type="text" id="actor-filter" placeholder="Actor" />
    <input type="text" id="theme-filter" placeholder="Theme" />
    <input type="date" id="start-date" />
    <input type="date" id="end-date" />
    <button id="reset-filters">Reset Filters</button>
  </div>

  <table id="movie-table">
    <thead>
      <tr>
        <th data-key="title">Title</th>
        <th data-key="year">Year</th>
        <th data-key="genre">Genre</th>
        <th data-key="bearHandsRating">Bear</th>
        <th data-key="hubbyBearRating">Hubby</th>
        <th>Actors</th>
        <th>Directors</th>
        <th>Writers</th>
        <th data-key="dateWatched">Watched</th>
        <th>Themes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="pagination-controls">
    <button id="prevPage">Previous</button>
    <span id="pageIndicator">Page 1</span>
    <button id="nextPage">Next</button>
    <label for="rows-select">Movies per page:</label>
    <select id="rows-select">
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100" selected>100</option>
    </select>
  </div>

  <div id="pagination-buttons"></div>

  <script src="script.js"></script>
</body>
</html>
