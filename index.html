<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Movie Dashboard</h1>
    <div class="search-bar">
      <input type="text" id="global-search" placeholder="Search all fields..." />
      <button id="reset-filters">Reset Filters</button>
    </div>
  </header>

  <table>
    <thead>
      <!-- Filter Row -->
      <tr class="search-row">
        <td><input type="text" placeholder="Title" id="search-title" /></td>
        <td><input type="text" placeholder="Year" id="search-year" /></td>
        <td><input type="text" placeholder="Genre" id="search-genre" /></td>
        <td><input type="text" placeholder="Bear Hands" id="search-bear" /></td>
        <td><input type="text" placeholder="Hubby Bear" id="search-hubby" /></td>
        <td><input type="text" placeholder="Actors" id="search-actors" /></td>
        <td><input type="text" placeholder="Directors" id="search-directors" /></td>
        <td><input type="text" placeholder="Writers" id="search-writers" /></td>
        <td><input type="text" placeholder="Production" id="search-production" /></td>
        <td><input type="text" placeholder="Date Watched" id="search-date" /></td>
        <td><input type="text" placeholder="Themes" id="search-themes" /></td>
      </tr>

      <!-- Header Row -->
      <tr class="header-row">
        <th data-sort="title">Title ▲▼</th>
        <th data-sort="year">Year ▲▼</th>
        <th data-sort="genre">Genre ▲▼</th>
        <th data-sort="bearHandsRating">Bear Hands ▲▼</th>
        <th data-sort="hubbyBearRating">Hubby Bear ▲▼</th>
        <th data-sort="actors">Actors ▲▼</th>
        <th data-sort="directors">Directors ▲▼</th>
        <th data-sort="writers">Writers ▲▼</th>
        <th data-sort="production">Production ▲▼</th>
        <th data-sort="dateWatched">Date Watched ▲▼</th>
        <th data-sort="themesKeywords">Themes ▲▼</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <div id="pagination" class="pagination"></div>

  <script src="script.js"></script>
</body>
</html>
