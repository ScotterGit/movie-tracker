<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bear Hands Movie Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎬 Bear Hands Movie Tracker</h1>
  <input type="text" id="search-bar" placeholder="Search movies..." />
  <table id="movie-table">
  <thead>
    <tr>
      <th data-key="title">Title</th>
      <th data-key="genre">Genre</th>
      <th data-key="rating">Rating</th>
      <th data-key="platform">Platform</th>
      <th data-key="rewatch">Rewatch</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
  <script src="script.js"></script>
</body>
</html>
