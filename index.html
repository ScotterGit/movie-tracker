<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bear Hands Movie Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎬 Bear Hands Movie Tracker</h1>
  <input type="text" id="search-bar" placeholder="Search movies..." />
  <table id="movie-table">
    <thead>
      <tr>
        <th data-key="title">Title <span class="arrow"></span></th>
        <th data-key="genre">Genre <span class="arrow"></span></th>
        <th data-key="rating">Rating <span class="arrow"></span></th>
        <th data-key="platform">Platform <span class="arrow"></span></th>
        <th data-key="rewatch">Rewatch <span class="arrow"></span></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="script.js"></script>
</body>
</html>
