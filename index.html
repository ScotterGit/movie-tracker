<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bear Hands Movie Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎬 Bear Hands Movie Tracker</h1>

  <section id="controls">
    <input type="text" id="search-bar" placeholder="Search movies..." />

    <label for="rows-select">Movies per page:</label>
    <select id="rows-select">
      <option value="100">100</option>
      <option value="200">200</option>
      <option value="300">300</option>
    </select>

    <label for="genre-select">Genre:</label>
    <select id="genre-select"><option value="">All</option></select>

    <label for="year-select">Year:</label>
    <select id="year-select"><option value="">All</option></select>

    <label for="director-select">Director:</label>
    <select id="director-select"><option value="">All</option></select>

    <label for="writer-select">Writer:</label>
    <select id="writer-select"><option value="">All</option></select>

    <label for="bear-rating-select">Bear Hands ⭐:</label>
    <select id="bear-rating-select">
      <option value="">All</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
    </select>

    <label for="hubby-rating-select">Hubby Bear ⭐:</label>
    <select id="hubby-rating-select">
      <option value="">All</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
    </select>


    <label for="actor-filter">Actor:</label>
    <input type="text" id="actor-filter" placeholder="Name..." />

    <label for="theme-filter">Theme/Keyword:</label>
    <input type="text" id="theme-filter" placeholder="Keyword..." />

    <button id="reset-filters">Reset Filters</button>
  </section>

  <table id="movie-table">
    <thead>
      <tr>
        <th data-key="title">Title <span class="arrow"></span></th>
        <th data-key="year">Year <span class="arrow"></span></th>
        <th data-key="genre">Genre <span class="arrow"></span></th>
        <th data-key="bearHandsRating">Bear Hands ⭐ <span class="arrow"></span></th>
        <th data-key="hubbyBearRating">Hubby Bear ⭐ <span class="arrow"></span></th>
        <th data-key="actors">Actor <span class="arrow"></span></th>
        <th data-key="directors">Director <span class="arrow"></span></th>
        <th data-key="writers">Writer <span class="arrow"></span></th>
        <th data-key="dateWatched">Date Watched <span class="arrow"></span></th>
        <th data-key="themesKeywords">Themes/Keywords <span class="arrow"></span></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="pagination"></div>

  <script src="script.js"></script>
</body>
</html>
