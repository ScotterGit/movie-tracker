<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Movie Tracker</h1>

  <!-- 🔍 Search Bar -->
  <div id="search-bar">
    <label for="actor-filter">Search by Actor:</label>
    <input type="text" id="actor-filter" placeholder="e.g. Keanu Reeves" />
  </div>

  <!-- 🎛️ Filter Controls -->
  <div id="controls">
    <div>
      <label for="genre-select">Genre:</label>
      <select id="genre-select"></select>
    </div>
    <div>
      <label for="year-select">Year:</label>
      <select id="year-select"></select>
    </div>
    <div>
      <label for="bear-rating-select">Bear Hands Rating:</label>
      <select id="bear-rating-select"></select>
    </div>
    <div>
      <label for="hubby-rating-select">Hubby Bear Rating:</label>
      <select id="hubby-rating-select"></select>
    </div>
    <div>
      <label for="director-filter">Director:</label>
      <input type="text" id="director-filter" />
    </div>
    <div>
      <label for="writer-filter">Writer:</label>
      <input type="text" id="writer-filter" />
    </div>
    <div>
      <label for="theme-filter">Theme/Keyword:</label>
      <input type="text" id="theme-filter" />
    </div>
    <div>
      <label for="start-date">Start Date:</label>
      <input type="date" id="start-date" />
    </div>
    <div>
      <label for="end-date">End Date:</label>
      <input type="date" id="end-date" />
    </div>
    <button id="reset-filters">Reset Filters</button>
  </div>

  <!-- 📊 Movie Table -->
  <table id="movie-table">
    <thead>
      <tr>
        <th data-key="title">Title</th>
        <th data-key="year">Year</th>
        <th data-key="genre">Genre</th>
        <th data-key="bearHandsRating">Bear</th>
        <th data-key="hubbyBearRating">Hubby</th>
        <th>Actors</th>
        <th>Directors</th>
        <th>Writers</th>
        <th data-key="dateWatched">Watched</th>
        <th>Themes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- ⏮️ Pagination Controls -->
  <div class="pagination-controls">
    <button id="prevPage">Previous</button>
    <span id="pageIndicator">Page 1</span>
    <button id="nextPage">Next</button>
    <label for="rows-select">Movies per page:</label>
    <select id="rows-select">
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100" selected>100</option>
    </select>
  </div>

  <div id="pagination-buttons"></div>

  <script src="script.js"></script>
</body>
</html>
