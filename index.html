<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bear Hands Movie Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎬 Bear Hands Movie Tracker</h1>

  <input type="text" id="search-bar" placeholder="Search movies..." />

  <label for="rows-select">Movies per page:</label>
  <select id="rows-select">
    <option value="100">100</option>
    <option value="200">200</option>
    <option value="300">300</option>
  </select>
  <label for="genre-select">Filter by genre:</label>
  <select id="genre-select">
    <option value="">All genres</option>
  </select>


  <table id="movie-table">
    <thead>
      <tr>
        <th data-key="title">Title <span class="arrow"></span></th>
        <th data-key="year">Year <span class="arrow"></span></th>
        <th data-key="genre">Genre <span class="arrow"></span></th>
        <th data-key="bearHandsRating">Bear Hands ⭐ <span class="arrow"></span></th>
        <th data-key="hubbyBearRating">Hubby Bear ⭐ <span class="arrow"></span></th>
        <th data-key="actors">Actor <span class="arrow"></span></th>
        <th data-key="director">Director <span class="arrow"></span></th>
        <th data-key="writer">Writer <span class="arrow"></span></th>
        <th data-key="dateWatched">Date Watched <span class="arrow"></span></th>
        <th data-key="themesKeywords">Themes/Keywords <span class="arrow"></span></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="pagination"></div>

  <script src="script.js"></script>
</body>
</html>
